<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fd3ff">
  <title>Read Along</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="read.css">
</head>
<body>
  <!-- Bookshelf -->
  <section id="shelf" class="view">
    <div class="bar">
      <a class="btn round" href="../../index.html" aria-label="Home">🏠</a>
      <h1 class="shelf-title"><span class="emoji">📚</span></h1>
      <button class="btn round lock" id="grown-ups" aria-label="Grown-ups">🔒</button>
    </div>
    <div class="books"></div>
  </section>

  <!-- Reading a book -->
  <section id="reader" class="view" hidden>
    <div class="bar">
      <button class="btn round" id="to-shelf" aria-label="Back to the books">📚</button>
      <button class="btn round who" id="who" aria-label="Who is reading?" hidden>🗣️</button>
      <div class="speeds">
        <button class="btn round" data-speed="slow" aria-label="Slow">🐢</button>
        <button class="btn round" data-speed="normal" aria-label="Normal">🚶</button>
        <button class="btn round" data-speed="fast" aria-label="Fast">🐇</button>
      </div>
    </div>
    <div id="page-wrap"><article id="page"></article></div>
    <div class="controls">
      <button class="btn big" id="prev" aria-label="Page back">⬅️</button>
      <button class="btn big" id="again" aria-label="Say it again">🔁</button>
      <button class="btn huge" id="play" aria-label="Read to me">▶️</button>
      <button class="btn big" id="next" aria-label="Next page">➡️</button>
    </div>
    <div id="dots"></div>
  </section>


  <!-- Grown-ups: manage books -->
  <div id="admin" class="sheet" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>Books</h2>
        <button class="btn round" id="admin-close" aria-label="Close">✖️</button>
      </div>
      <div class="row two">
        <button class="btn wide" id="add-book">➕ New book</button>
        <button class="btn wide" id="import-reading">📥 Import a reading</button>
      </div>
      <input type="file" id="import-input" accept=".json,application/json" hidden>
      <ul id="book-list"></ul>
      <h3>Word highlighting on this device</h3>
      <div class="row timing">
        <button class="btn small" id="lag" type="button">🐢 Words lag behind</button>
        <button class="btn small" id="ahead" type="button">🐇 Words run ahead</button>
        <button class="btn small" id="timing-reset" type="button">↺ Reset</button>
      </div>
      <p class="note" id="timing-note"></p>
    </div>
  </div>

  <!-- Grown-ups: edit one book -->
  <div id="editor" class="sheet" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2 id="editor-title">New book</h2>
        <button class="btn round" id="editor-close" aria-label="Close">✖️</button>
      </div>
      <label>Title <input id="f-title" placeholder="Leave empty to use the # heading"></label>
      <div class="field">Cover <div id="f-emoji" class="picker"></div></div>
      <div class="field">Colour <div id="f-colour" class="picker"></div></div>
      <label>Voice
        <span class="inline"><select id="f-voice"></select><button class="btn small" id="f-voice-test" type="button">🔊 Try</button></span>
      </label>
      <label>Speed
        <select id="f-speed">
          <option value="slow">🐢 Slow</option>
          <option value="normal" selected>🚶 Normal</option>
          <option value="fast">🐇 Fast</option>
        </select>
      </label>
      <label>Story
        <span class="inline"><button class="btn small" id="f-file" type="button">📄 Load a .txt / .md file</button><input type="file" id="f-file-input" accept=".txt,.md,.markdown,text/plain,text/markdown" hidden></span>
        <textarea id="f-text" rows="12" placeholder="Paste or type the story here.

# A heading
Use **big** for a strong word and *soft* for a gentle one.
Leave a blank line between paragraphs.
Put --- on its own line to start a new page."></textarea>
      </label>
      <div class="field" id="f-readings">Family readings
        <ul id="readings-list"></ul>
        <button class="btn small" id="new-reading" type="button">🎙️ Record a new reading</button>
        <p class="note" id="readings-note"></p>
      </div>
      <div class="row">
        <button class="btn" id="f-delete" type="button">🗑️ Delete</button>
        <button class="btn" id="f-save" type="button">💾 Save</button>
      </div>
    </div>
  </div>

  <!-- Grown-ups: who is recording? -->
  <div id="reading-new" class="sheet" hidden>
    <div class="panel small-panel">
      <div class="panel-head">
        <h2>Who's reading?</h2>
        <button class="btn round" id="rn-close" aria-label="Close">✖️</button>
      </div>
      <label>Name <input id="rn-name" placeholder="e.g. Grandpa" maxlength="20"></label>
      <div class="field">Face <div id="rn-face" class="picker"></div></div>
      <div class="row"><button class="btn" id="rn-start" type="button">🎙️ Start recording</button></div>
    </div>
  </div>

  <!-- Grown-ups: recording a book page by page -->
  <div id="recorder" class="sheet" hidden>
    <div class="rec-box">
      <div class="rec-head">
        <span class="emoji rec-face"></span><b class="rec-who"></b>
        <button class="btn round" id="rec-close" aria-label="Finish">✔️</button>
      </div>
      <div class="rec-wrap"><article id="rec-page"></article></div>
      <div class="rec-status"></div>
      <div class="rec-controls">
        <button class="btn big" id="rec-prev" aria-label="Page back">⬅️</button>
        <button class="btn big" id="rec-listen" aria-label="Listen back">▶️</button>
        <button class="btn huge rec-btn" id="rec-go" aria-label="Record this page"><span class="dot"></span></button>
        <button class="btn big" id="rec-next" aria-label="Next page">➡️</button>
      </div>
      <div class="rec-dots"></div>
    </div>
  </div>

  <script src="../../shared/sound.js"></script>
  <script src="../../shared/celebrate.js"></script>
  <script src="../../shared/gate.js"></script>
  <script src="story.js"></script>
  <script src="defaults.js"></script>
  <script src="readings.js"></script>
  <script src="read.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(() => {});
  </script>
</body>
</html>
