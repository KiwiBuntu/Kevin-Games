<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fd3ff">
  <title>Mazes</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    body { display: flex; flex-direction: column; }
    #bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px 10px;
      flex-wrap: wrap;
    }
    #bar .group { display: flex; gap: 8px; align-items: center; }
    #sizes .btn { font-size: 20px; padding: 0 8px; }
    @media (max-width: 600px) { #bar { justify-content: center; } }
    #board { flex: 1; width: 100%; min-height: 0; touch-action: none; display: block; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="group">
      <a class="btn round" href="../../index.html" aria-label="Home">🏠</a>
    </div>
    <div class="group" id="sizes">
      <button class="btn" data-size="small" aria-label="Small maze">🟩</button>
      <button class="btn" data-size="medium" aria-label="Medium maze">🟩🟩</button>
      <button class="btn" data-size="big" aria-label="Big maze">🟩🟩🟩</button>
    </div>
    <div class="group">
      <button class="btn round" id="who" aria-label="Change character">🚗</button>
      <button class="btn round" id="hint" aria-label="Hint">💡</button>
      <button class="btn round" id="new" aria-label="New maze">🔄</button>
      <button class="btn round" id="mute" aria-label="Sound on or off">🔊</button>
    </div>
  </div>
  <canvas id="board"></canvas>

  <script src="../../shared/sound.js"></script>
  <script src="../../shared/celebrate.js"></script>
  <script src="../../shared/win.js"></script>
  <script src="maze.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(() => {});
  </script>
</body>
</html>
