<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fd3ff">
  <title>Cube Pop</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    body { display: flex; flex-direction: column; }
    .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .view[hidden] { display: none; }
    .bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px 10px;
    }
    .bar .group { display: flex; gap: 8px; align-items: center; }
    .bar h1 {
      margin: 0; font-size: clamp(30px, 6vw, 52px); color: #fff;
      -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink);
    }
    .level-badge {
      background: #fff; border: 4px solid var(--ink); border-radius: 20px; box-shadow: 0 4px 0 var(--ink);
      padding: 2px 16px; font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 8px;
    }
    .level-badge .emoji { font-size: 34px; }

    /* level picker */
    .levels {
      flex: 1; overflow-y: auto; padding: 12px 18px 30px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 18px; align-content: start;
      max-width: 1000px; width: 100%; margin: 0 auto;
    }
    .lvl {
      position: relative; aspect-ratio: 1; border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 7px 0 var(--ink);
      background: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font: inherit; font-weight: 700; font-size: 22px; color: var(--ink);
    }
    .lvl:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
    .lvl .emoji { font-size: 56px; line-height: 1.1; }
    .lvl .star { position: absolute; top: -12px; right: -10px; font-family: var(--emoji); font-size: 32px; }
    .lvl.locked { background: #e3e6ee; cursor: default; }
    .lvl.locked .emoji { filter: grayscale(1) opacity(0.35); }
    .lvl.next { background: var(--sun); animation: nudge 1.2s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

    /* playing */
    #stage { flex: 1; min-height: 0; position: relative; }
    #model { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    .blasters {
      display: flex; justify-content: center; align-items: flex-end; gap: 14px; flex-wrap: wrap;
      padding: 8px 12px max(14px, env(safe-area-inset-bottom));
    }
    .blaster {
      position: relative; width: 86px; height: 86px; border-radius: 50%; padding: 0; cursor: pointer;
      border: 6px solid var(--ink); box-shadow: 0 7px 0 var(--ink), inset 0 -10px 0 rgba(0, 0, 0, 0.18), inset 0 8px 0 rgba(255, 255, 255, 0.35);
      background: var(--c); transition: transform 0.08s, opacity 0.2s;
    }
    .blaster::before { /* the nozzle */
      content: ""; position: absolute; left: 50%; top: -20px; width: 26px; height: 22px; margin-left: -13px;
      background: var(--c); border: 5px solid var(--ink); border-bottom: 0; border-radius: 8px 8px 0 0;
    }
    .blaster .count {
      position: absolute; bottom: -10px; right: -10px; min-width: 34px; height: 34px; padding: 0 6px; border-radius: 17px;
      background: #fff; border: 4px solid var(--ink); font-weight: 700; font-size: 20px; line-height: 26px; text-align: center;
    }
    .blaster.hidden-side { opacity: 0.5; }
    .blaster.hidden-side .count { font-family: var(--emoji); font-size: 16px; }
    .blaster.fire { animation: squash 0.3s; }
    .blaster.hint { animation: hop 0.5s 2; }
    .blaster.rainbow { background: conic-gradient(#ff4d4d, #ff9f1c, #ffd60a, #8ac926, #3a86ff, #8338ec, #ff5fa2, #ff4d4d); animation: glow 0.9s ease-in-out infinite; }
    .blaster.rainbow::before { background: #ffd60a; }
    @keyframes squash { 30% { transform: scale(1.25, 0.75); } 60% { transform: scale(0.9, 1.15); } }
    @keyframes hop { 50% { transform: translateY(-16px) scale(1.1); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 7px 0 var(--ink), 0 0 0 0 rgba(255, 243, 107, 0.9); } 50% { box-shadow: 0 7px 0 var(--ink), 0 0 0 14px rgba(255, 243, 107, 0.9); } }
    .spin-hint { position: absolute; left: 50%; bottom: 8px; translate: -50% 0; font-family: var(--emoji); font-size: 34px; opacity: 0.55; pointer-events: none; animation: sway 2s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: translateX(-14px); } 50% { transform: translateX(14px); } }

    @media (max-width: 600px) {
      .blaster { width: 66px; height: 66px; border-width: 5px; }
      .blaster::before { width: 20px; height: 16px; top: -16px; margin-left: -10px; border-width: 4px; }
      .blasters { gap: 10px; }
      .level-badge { font-size: 24px; }
    }
  </style>
</head>
<body>
  <section id="picker" class="view">
    <div class="bar">
      <a class="btn round" href="../../index.html" aria-label="Home">🏠</a>
      <h1>Cube Pop</h1>
      <span style="width:60px"></span>
    </div>
    <div class="levels"></div>
  </section>

  <section id="game" class="view" hidden>
    <div class="bar">
      <button class="btn round" id="to-levels" aria-label="All the models">🗂️</button>
      <div class="level-badge"><span class="emoji" id="lvl-emoji"></span><span id="lvl-num"></span></div>
      <div class="group">
        <button class="btn round" id="restart" aria-label="Start this one again">🔄</button>
        <button class="btn round" id="mute" aria-label="Sound on or off">🔊</button>
      </div>
    </div>
    <div id="stage">
      <canvas id="model"></canvas>
      <div class="spin-hint">👆↔️</div>
    </div>
    <div class="blasters"></div>
  </section>

  <script src="../../shared/sound.js"></script>
  <script src="../../shared/gate.js"></script>
  <script src="../../shared/guard.js"></script>
  <script src="../../shared/celebrate.js"></script>
  <script src="../../shared/win.js"></script>
  <script src="levels.js"></script>
  <script src="cubes.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(() => {});
  </script>
</body>
</html>
