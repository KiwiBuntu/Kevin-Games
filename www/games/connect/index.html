<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fd3ff">
  <title>Connect</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    body { display: flex; flex-direction: column; background: linear-gradient(#7fd3ff, #c9f0ff); }
    .bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px 6px;
    }
    .bar .group { display: flex; gap: 8px; align-items: center; }
    .score {
      background: #fff; border: 4px solid var(--ink); border-radius: 20px; box-shadow: 0 4px 0 var(--ink);
      padding: 2px 14px; font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .score .who { font-family: var(--emoji); font-size: 26px; }
    .score .disc { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--ink); display: inline-block; }
    .score .turn { outline: 4px solid var(--sun); outline-offset: 2px; animation: bob 0.8s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    #stage { flex: 1; min-height: 0; position: relative; }
    #board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

    .sheet { position: fixed; inset: 0; z-index: 30; background: rgba(43, 45, 66, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
    .sheet[hidden] { display: none; }
    .card {
      background: #fff; border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 var(--ink);
      padding: 16px 20px 20px; text-align: center; width: min(100%, 560px); margin: auto;
    }
    .card h2 { margin: 0 0 6px; font-size: 34px; }
    .pick { display: flex; gap: 12px; justify-content: center; margin: 10px 0 4px; flex-wrap: wrap; }
    .choice {
      appearance: none; font: inherit; color: var(--ink); cursor: pointer; background: #f2f2f6;
      border: 4px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 var(--ink);
      padding: 8px 14px; min-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 22px; font-weight: 700;
    }
    .choice:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
    .choice.on { background: var(--sun); }
    .choice .big { font-family: var(--emoji); font-size: 44px; line-height: 1.1; }
    .choice canvas { display: block; }
    .stars { font-family: var(--emoji); font-size: 30px; letter-spacing: -4px; }
    #brain .choice.on { background: #8338ec; }
    #brain[hidden] { display: none; }
    #go { margin-top: 14px; font-size: 44px; height: 80px; min-width: 140px; border-radius: 24px; background: #8be08b; }

    #result { align-items: flex-start; background: rgba(43, 45, 66, 0.15); padding-top: max(80px, env(safe-area-inset-top)); }
    #result .card { margin: 0 auto; }
    .result { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; padding: 10px 16px; width: auto; }
    .result h2 { margin: 0; }
    .result .row { margin-top: 0 !important; }
    .result .pic { font-family: var(--emoji); font-size: 60px; line-height: 1.1; animation: win-wiggle 1s ease-in-out infinite; }
    .result h2 { font-size: 36px; }
    .result .row { display: flex; gap: 16px; justify-content: center; margin-top: 12px; }
    .result .row .btn { font-size: 40px; height: 80px; min-width: 100px; }
    @media (max-width: 480px) {
      .score { font-size: 22px; padding: 2px 8px; gap: 5px; }
      .score .who { font-size: 20px; }
      .score .disc { width: 20px; height: 20px; }
      #brain .choice { min-width: 0; }
      .stars { font-size: 24px; }
      .choice { min-width: 96px; font-size: 18px; padding: 6px 8px; }
      .choice .big { font-size: 36px; }
      .card h2 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a class="btn round" href="../../index.html" aria-label="Home">🏠</a>
    <div class="score" id="score"></div>
    <div class="group">
      <button class="btn round" id="new" aria-label="New game">🔄</button>
      <button class="btn round" id="mute" aria-label="Sound on or off">🔊</button>
    </div>
  </div>
  <div id="stage"><canvas id="board"></canvas></div>

  <!-- Choose a board and who to play -->
  <div class="sheet" id="setup" hidden>
    <div class="card">
      <h2>Let's play!</h2>
      <div class="pick" id="sizes">
        <button class="choice" data-size="3" aria-label="Small board, three in a row"><canvas width="110" height="90"></canvas>3 in a row</button>
        <button class="choice" data-size="4" aria-label="Big board, four in a row"><canvas width="110" height="90"></canvas>4 in a row</button>
      </div>
      <div class="pick" id="modes">
        <button class="choice" data-mode="android" aria-label="Play with the Android"><span class="big">🤖</span>Android</button>
        <button class="choice" data-mode="friend" aria-label="Play with a friend"><span class="big">🧒🧑</span>Friend</button>
      </div>
      <div class="pick" id="brain">
        <button class="choice" data-level="1" aria-label="Easy Android"><span class="stars">⭐</span></button>
        <button class="choice" data-level="2" aria-label="Clever Android"><span class="stars">⭐⭐</span></button>
        <button class="choice" data-level="3" aria-label="Super clever Android"><span class="stars">⭐⭐⭐</span></button>
      </div>
      <button class="btn" id="go" aria-label="Play">▶️</button>
    </div>
  </div>

  <!-- The Android won, or nobody did -->
  <div class="sheet" id="result" hidden>
    <div class="card result">
      <div class="pic" id="result-pic"></div>
      <h2 id="result-text"></h2>
      <div class="row">
        <button class="btn" id="again" aria-label="Play again">▶️</button>
        <button class="btn" id="result-setup" aria-label="Change game">🔄</button>
      </div>
    </div>
  </div>

  <script src="../../shared/sound.js"></script>
  <script src="../../shared/gate.js"></script>
  <script src="../../shared/guard.js"></script>
  <script src="../../shared/celebrate.js"></script>
  <script src="../../shared/win.js"></script>
  <script src="board.js"></script>
  <script src="connect.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(() => {});
  </script>
</body>
</html>
