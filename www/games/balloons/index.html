<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fd3ff">
  <title>Balloon Pop</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    body { display: flex; flex-direction: column; }
    #bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px 10px;
      position: relative; z-index: 2;
    }
    #bar .group { display: flex; gap: 8px; align-items: center; }

    /* How many balloons popped so far */
    #progress {
      flex: 1; max-width: 360px; height: 34px; position: relative;
      border: 4px solid var(--ink); border-radius: 20px; background: #fff;
      box-shadow: 0 4px 0 var(--ink); overflow: hidden;
    }
    #fill {
      position: absolute; inset: 0 auto 0 0; width: 0%;
      background: repeating-linear-gradient(-45deg, #ff5fa2 0 14px, #ff8fc8 14px 28px);
      transition: width 0.3s cubic-bezier(.2, 1.4, .4, 1);
    }
    #progress .goal {
      position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
      font-family: var(--emoji); font-size: 22px;
    }

    #board { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; z-index: 1; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="group">
      <a class="btn round" href="../../index.html" aria-label="Home">🏠</a>
    </div>
    <div id="progress" aria-label="Balloons popped"><div id="fill"></div><span class="goal">🎈</span></div>
    <div class="group">
      <button class="btn round" id="mode" aria-label="Change balloons">🎨</button>
      <button class="btn round" id="speed" aria-label="Speed">🐢</button>
      <button class="btn round" id="mute" aria-label="Sound on or off">🔊</button>
    </div>
  </div>
  <canvas id="board"></canvas>

  <script src="../../shared/sound.js"></script>
  <script src="../../shared/celebrate.js"></script>
  <script src="../../shared/win.js"></script>
  <script src="balloons.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(() => {});
  </script>
</body>
</html>
