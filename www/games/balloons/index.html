<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fd3ff">
  <title>Balloon Pop</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    body { display: flex; flex-direction: column; }
    #bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px 10px;
      position: relative; z-index: 2;
    }
    #bar .group { display: flex; gap: 8px; align-items: center; }

    /* How many balloons popped so far */
    #progress {
      flex: 1; max-width: 360px; height: 34px; position: relative;
      border: 4px solid var(--ink); border-radius: 20px; background: #fff;
      box-shadow: 0 4px 0 var(--ink); overflow: hidden;
    }
    #fill {
      position: absolute; inset: 0 auto 0 0; width: 0%;
      background: repeating-linear-gradient(-45deg, #ff5fa2 0 14px, #ff8fc8 14px 28px);
      transition: width 0.3s cubic-bezier(.2, 1.4, .4, 1);
    }
    #progress .goal {
      position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
      font-family: var(--emoji); font-size: 22px;
    }

    /* Spelling mode: the word to spell */
    #spell {
      position: relative; z-index: 2; align-self: center;
      display: flex; align-items: center; gap: 10px;
      margin: 4px 12px 0; padding: 8px 14px;
      background: rgba(255, 255, 255, 0.92); border: 5px solid var(--ink); border-radius: 26px;
      box-shadow: 0 6px 0 var(--ink); cursor: pointer;
      --ts: min(64px, calc((100vw - 170px) / var(--n, 5)));
    }
    #spell[hidden], #spell .pic[hidden] { display: none; }
    #spell .pic, #spell .ear { font-family: var(--emoji); font-size: calc(var(--ts) * 0.9); line-height: 1; }
    #spell .ear { font-size: calc(var(--ts) * 0.5); }
    @media (max-width: 480px) { #spell .ear { display: none; } }
    #spell .tiles { display: flex; gap: 6px; }
    #spell .tile {
      position: relative;
      width: var(--ts); height: calc(var(--ts) * 1.15);
      display: flex; align-items: center; justify-content: center;
      font-size: calc(var(--ts) * 0.8); font-weight: 700; color: var(--ink);
      background: #eef0f7; border: 4px solid var(--ink); border-radius: 14px;
    }
    #spell .tile.done { background: #8ac926; color: #fff; }
    #spell .tile.done::after {
      content: "✓"; position: absolute; top: -12px; right: -10px;
      width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid var(--ink);
      color: #3a9e3c; font-size: 18px; line-height: 20px; text-align: center;
    }
    #spell .tile.next { background: var(--sun); animation: nextbob 0.9s ease-in-out infinite; }
    #spell .tile.hint { animation: wiggle 0.5s; }
    #spell.yay .tile { animation: nextbob 0.5s ease-in-out infinite; }
    #spell.yay .tile:nth-child(2n) { animation-delay: 0.15s; }
    @keyframes nextbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg) scale(1.15); } 75% { transform: rotate(12deg) scale(1.15); } }

    /* Grown-ups: spelling word list */
    .lock { opacity: 0.55; font-size: 22px; }
    #words-lock[hidden] { display: none; }
    .sheet { position: fixed; inset: 0; z-index: 30; background: rgba(43, 45, 66, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .sheet[hidden] { display: none; }
    .panel {
      background: #fff; border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 var(--ink); padding: 20px;
      width: min(100%, 720px); max-height: 100%; overflow-y: auto; font-size: 18px;
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; }
    .panel h2 { margin: 0; }
    .panel h3 { margin: 16px 0 6px; }
    .note { color: #666; font-size: 14px; margin: 6px 0; }
    #word-list { list-style: none; padding: 0; margin: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; }
    #word-list li {
      display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px;
      border: 3px solid var(--ink); border-radius: 14px; background: #f6f6fa; font-weight: 700;
    }
    #word-list li.first { background: #fff3b0; }
    #word-list li .pic { font-family: var(--emoji); }
    #word-list li .said { font-weight: 500; color: #777; font-size: 14px; }
    #word-list li button { border: 0; background: none; cursor: pointer; font-family: var(--emoji); font-size: 20px; padding: 2px 4px; opacity: 0.6; }
    #word-list li button:hover, #word-list li.first .star { opacity: 1; }
    .add-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .add-row input { font: inherit; border: 3px solid var(--ink); border-radius: 12px; padding: 6px 10px; flex: 1 1 140px; min-width: 0; }
    #w-word { text-transform: uppercase; }
    .btn.small { height: 44px; font-size: 18px; border-radius: 12px; font-family: var(--font); }
    .panel-foot { margin-top: 16px; }

    #board { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; z-index: 1; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="group">
      <a class="btn round" href="../../index.html" aria-label="Home">🏠</a>
    </div>
    <div id="progress" aria-label="Balloons popped"><div id="fill"></div><span class="goal">🎈</span></div>
    <div class="group">
      <button class="btn round" id="mode" aria-label="Change balloons">🎨</button>
      <button class="btn round" id="speed" aria-label="Speed">🐢</button>
      <button class="btn round" id="mute" aria-label="Sound on or off">🔊</button>
      <button class="btn round lock" id="words-lock" aria-label="Grown-ups: spelling words" hidden>🔒</button>
    </div>
  </div>
  <div id="spell" hidden aria-label="Word to spell — tap to hear it">
    <div class="pic"></div>
    <div class="tiles"></div>
    <div class="ear">🗣️</div>
  </div>
  <canvas id="board"></canvas>

  <!-- Grown-ups: the spelling word list -->
  <div id="words-panel" class="sheet" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>Spelling words</h2>
        <button class="btn round" id="words-close" aria-label="Close">✖️</button>
      </div>
      <p class="note">⭐ marks the word that is always asked first. The others come in a random order.</p>
      <ul id="word-list"></ul>
      <h3>Add a word</h3>
      <div class="add-row">
        <input id="w-word" placeholder="Word (letters only)" maxlength="10" autocapitalize="characters" autocomplete="off">
        <input id="w-pic" placeholder="Picture 🙂 (optional)" maxlength="8" autocomplete="off">
        <input id="w-say" placeholder="Say it as… (optional)" autocomplete="off">
        <button class="btn small" id="w-add" type="button">➕ Add</button>
      </div>
      <p class="note">"Say it as" is how the voice reads the word, e.g. "Granny" for GRANNY or "the" for THE.</p>
      <div class="panel-foot">
        <button class="btn small" id="w-reset" type="button">↺ Back to the original list</button>
      </div>
    </div>
  </div>

  <script src="../../shared/sound.js"></script>
  <script src="../../shared/guard.js"></script>
  <script src="../../shared/celebrate.js"></script>
  <script src="../../shared/win.js"></script>
  <script src="../../shared/gate.js"></script>
  <script src="balloons.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(() => {});
  </script>
</body>
</html>
