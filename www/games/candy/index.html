<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff9ec7">
  <title>Candy Pop</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    body { display: flex; flex-direction: column; background: linear-gradient(#ffc2dc, #ffe3b3 60%, #c9f2e4); }
    .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .view[hidden] { display: none; }
    .bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px 8px;
    }
    .bar h1 {
      margin: 0; font-size: clamp(30px, 6vw, 52px); color: #fff;
      -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink);
    }

    /* level map: a winding path of sweets */
    .map { flex: 1; overflow-y: auto; padding: 10px 10px 40px; }
    .path { position: relative; max-width: 560px; margin: 0 auto; }
    .node {
      position: relative; width: 84px; height: 84px; border-radius: 50%; margin: 8px 0;
      border: 6px solid var(--ink); box-shadow: 0 7px 0 var(--ink); background: #fff;
      font: inherit; font-size: 30px; font-weight: 700; color: var(--ink); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .node .stars { position: absolute; bottom: -24px; left: 50%; translate: -50% 0; font-family: var(--emoji); font-size: 16px; white-space: nowrap; }
    .node.locked { background: #e3e6ee; color: #9aa0b4; cursor: default; }
    .node.next { background: var(--sun); animation: nudge 1.2s ease-in-out infinite; }
    .node.done { background: #ff9ec7; }
    @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    /* playing */
    .goals { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .goal {
      display: flex; align-items: center; gap: 4px; background: #fff; border: 4px solid var(--ink);
      border-radius: 16px; box-shadow: 0 4px 0 var(--ink); padding: 2px 10px 2px 4px; font-weight: 700; font-size: 24px;
    }
    .goal canvas { width: 34px; height: 34px; }
    .goal .e { font-family: var(--emoji); font-size: 26px; }
    .goal.done { background: #c9f7c2; }
    .goal.done .n::after { content: " ✓"; color: #3a9e3c; }
    .moves {
      background: var(--sun); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink);
      padding: 0 12px; font-size: 30px; font-weight: 700; min-width: 70px; text-align: center; line-height: 52px;
    }
    .moves.low { background: #ff9ea0; animation: nudge 0.8s ease-in-out infinite; }
    #stage { flex: 1; min-height: 0; position: relative; }
    #board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

    .sheet { position: fixed; inset: 0; z-index: 45; background: rgba(43, 45, 66, 0.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .sheet[hidden] { display: none; }
    .card {
      background: #fff; border: 6px solid var(--ink); border-radius: 30px; box-shadow: 0 10px 0 var(--ink);
      padding: 22px 28px; text-align: center; animation: pop 0.45s cubic-bezier(.2, 1.6, .4, 1);
    }
    .card h2 { margin: 0 0 6px; font-size: 44px; color: #ff4d8d; }
    .card .left { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
    .card .row { display: flex; gap: 14px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .card .row .btn { font-size: 34px; height: 76px; min-width: 96px; }
    #bonus { background: #c9f7c2; font-family: var(--font); font-weight: 700; }
    #bonus[hidden] { display: none; }
    @keyframes pop { from { transform: scale(0.3); } to { transform: scale(1); } }

    #banner {
      position: absolute; left: 50%; top: 45%; translate: -50% -50%; z-index: 5; pointer-events: none;
      font-size: 54px; font-weight: 700; color: #fff; white-space: nowrap;
      -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink);
      opacity: 0; scale: 0.4; transition: opacity 0.2s, scale 0.3s cubic-bezier(.2, 1.6, .4, 1);
    }
    #banner.show { opacity: 1; scale: 1; }

    @media (max-width: 600px) {
      .goal { font-size: 18px; padding: 1px 8px 1px 2px; }
      .goal canvas { width: 26px; height: 26px; }
      .moves { font-size: 22px; line-height: 44px; min-width: 54px; }
      .bar { flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>
<body>
  <section id="map" class="view">
    <div class="bar">
      <a class="btn round" href="../../index.html" aria-label="Home">🏠</a>
      <h1>Candy Pop</h1>
      <span style="width:60px"></span>
    </div>
    <div class="map"><div class="path"></div></div>
  </section>

  <section id="game" class="view" hidden>
    <div class="bar">
      <button class="btn round" id="to-map" aria-label="Level map">🗺️</button>
      <div class="goals" id="goals"></div>
      <div class="moves" id="moves" aria-label="Moves left">20</div>
      <button class="btn round" id="mute" aria-label="Sound on or off">🔊</button>
    </div>
    <div id="stage"><canvas id="board"></canvas><div id="banner"></div></div>
  </section>

  <div id="out" class="sheet" hidden>
    <div class="card">
      <h2>Out of moves!</h2>
      <div>So close — still to go:</div>
      <div class="left" id="out-left"></div>
      <div class="row">
        <button class="btn" id="bonus" aria-label="Five more moves">🎁 +5</button>
        <button class="btn" id="retry" aria-label="Try again">🔄</button>
        <button class="btn" id="out-map" aria-label="Level map">🗺️</button>
      </div>
    </div>
  </div>

  <script src="../../shared/sound.js"></script>
  <script src="../../shared/celebrate.js"></script>
  <script src="../../shared/win.js"></script>
  <script src="board.js"></script>
  <script src="levels.js"></script>
  <script src="candy.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(() => {});
  </script>
</body>
</html>
