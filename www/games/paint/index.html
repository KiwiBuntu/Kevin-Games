<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fd3ff">
  <title>Paint &amp; Colour</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    body { display: flex; flex-direction: column; }
    #bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px 10px;
    }
    #bar { flex-wrap: wrap; }
    #bar .group { display: flex; gap: 8px; align-items: center; }
    @media (max-width: 480px) { #bar { justify-content: center; } }
    #main { flex: 1; min-height: 0; display: flex; gap: 10px; padding: 0 10px max(10px, env(safe-area-inset-bottom)); }
    #stage { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #page {
      background: #fff; border: 5px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--ink);
      touch-action: none; display: block;
    }
    #palette { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: center; }
    .swatch {
      width: 52px; height: 52px; border-radius: 50%; border: 4px solid var(--ink); background: var(--c);
      box-shadow: 0 4px 0 var(--ink); cursor: pointer; padding: 0;
      font-family: var(--emoji); font-size: 24px; line-height: 1;
      transition: transform 0.1s;
    }
    .swatch.selected { transform: scale(1.2); outline: 4px solid #fff; outline-offset: 2px; }
    .swatch.rainbow { background: conic-gradient(#ff4d4d, #ff9f1c, #ffd60a, #8ac926, #3a86ff, #8338ec, #ff5fa2, #ff4d4d); }
    #brush[hidden] { display: none; }
    @media (max-aspect-ratio: 1/1) {
      #main { flex-direction: column; }
      .swatch { width: 44px; height: 44px; font-size: 20px; }
    }
    @media (min-aspect-ratio: 1/1) {
      #palette { display: grid; grid-template-columns: repeat(2, 52px); gap: 14px; align-content: center; }
    }

    /* "Saved!" message */
    #toast {
      position: fixed; left: 50%; top: 40%; translate: -50% -50%; z-index: 60;
      background: #fff; border: 5px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink);
      padding: 12px 24px; font-size: 34px; font-weight: 700; pointer-events: none;
      opacity: 0; scale: 0.5; transition: opacity 0.2s, scale 0.3s cubic-bezier(.2, 1.6, .4, 1);
    }
    #toast.show { opacity: 1; scale: 1; }
    #toast span { font-family: var(--emoji); }

    /* Gallery of saved paintings */
    #gallery {
      position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
      background: linear-gradient(#d6ecff, #fff4d6);
    }
    #gallery[hidden] { display: none; }
    #gallery .head { display: flex; align-items: center; justify-content: space-between; padding: max(10px, env(safe-area-inset-top)) 12px 10px; }
    #gallery .head .title { font-family: var(--emoji); font-size: 40px; }
    #gallery .grid {
      flex: 1; overflow-y: auto; padding: 8px 16px 24px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; align-content: start;
    }
    #gallery .empty { grid-column: 1 / -1; text-align: center; font-family: var(--emoji); font-size: 80px; opacity: 0.5; padding-top: 60px; }
    .art { background: #fff; border: 5px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); overflow: hidden; }
    .art img { display: block; width: 100%; aspect-ratio: 1; cursor: pointer; }
    .art .row { display: flex; justify-content: space-around; padding: 6px; border-top: 3px solid var(--ink); }
    .art .row button {
      border: 0; background: none; font-family: var(--emoji); font-size: 26px; cursor: pointer; padding: 4px 10px; border-radius: 12px;
    }
    .art .row button.armed { background: #ff4d4d; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="group">
      <a class="btn round" href="../../index.html" aria-label="Home">🏠</a>
    </div>
    <div class="group">
      <button class="btn round" id="mode" aria-label="Colouring or drawing">🖍️</button>
      <button class="btn round" id="brush" aria-label="Brush size" hidden>●</button>
      <button class="btn round" id="new" aria-label="New picture">🔄</button>
      <button class="btn round" id="save" aria-label="Save my painting">💾</button>
      <button class="btn round" id="open-gallery" aria-label="My paintings">🖼️</button>
      <button class="btn round" id="mute" aria-label="Sound on or off">🔊</button>
    </div>
  </div>
  <div id="main">
    <div id="stage"><canvas id="page"></canvas></div>
    <div id="palette"></div>
  </div>

  <div id="toast"></div>
  <div id="gallery" hidden>
    <div class="head">
      <span class="title">🖼️</span>
      <button class="btn round" id="close-gallery" aria-label="Back to painting">✖️</button>
    </div>
    <div class="grid"></div>
  </div>

  <script src="../../shared/sound.js"></script>
  <script src="../../shared/celebrate.js"></script>
  <script src="pictures.js"></script>
  <script src="paint.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(() => {});
  </script>
</body>
</html>
