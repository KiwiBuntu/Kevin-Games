<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fd3ff">
  <title>Paint &amp; Colour</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    body { display: flex; flex-direction: column; }
    #bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px 10px;
    }
    #bar .group { display: flex; gap: 8px; align-items: center; }
    #main { flex: 1; min-height: 0; display: flex; gap: 10px; padding: 0 10px max(10px, env(safe-area-inset-bottom)); }
    #stage { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #page {
      background: #fff; border: 5px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--ink);
      touch-action: none; display: block;
    }
    #palette { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: center; }
    .swatch {
      width: 52px; height: 52px; border-radius: 50%; border: 4px solid var(--ink); background: var(--c);
      box-shadow: 0 4px 0 var(--ink); cursor: pointer; padding: 0;
      font-family: var(--emoji); font-size: 24px; line-height: 1;
      transition: transform 0.1s;
    }
    .swatch.selected { transform: scale(1.2); outline: 4px solid #fff; outline-offset: 2px; }
    .swatch.rainbow { background: conic-gradient(#ff4d4d, #ff9f1c, #ffd60a, #8ac926, #3a86ff, #8338ec, #ff5fa2, #ff4d4d); }
    #brush[hidden] { display: none; }
    @media (max-aspect-ratio: 1/1) {
      #main { flex-direction: column; }
      .swatch { width: 44px; height: 44px; font-size: 20px; }
    }
    @media (min-aspect-ratio: 1/1) {
      #palette { display: grid; grid-template-columns: repeat(2, 52px); gap: 14px; align-content: center; }
    }
  </style>
</head>
<body>
  <div id="bar">
    <div class="group">
      <a class="btn round" href="../../index.html" aria-label="Home">🏠</a>
    </div>
    <div class="group">
      <button class="btn round" id="mode" aria-label="Colouring or drawing">🖍️</button>
      <button class="btn round" id="brush" aria-label="Brush size" hidden>●</button>
      <button class="btn round" id="new" aria-label="New picture">🔄</button>
      <button class="btn round" id="mute" aria-label="Sound on or off">🔊</button>
    </div>
  </div>
  <div id="main">
    <div id="stage"><canvas id="page"></canvas></div>
    <div id="palette"></div>
  </div>

  <script src="../../shared/sound.js"></script>
  <script src="../../shared/celebrate.js"></script>
  <script src="pictures.js"></script>
  <script src="paint.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(() => {});
  </script>
</body>
</html>
