<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fd3ff">
  <title>Kevin's Games</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    body { display: flex; flex-direction: column; align-items: center; }
    h1, .games { position: relative; z-index: 1; }
    h1 {
      margin: max(24px, env(safe-area-inset-top)) 16px 8px;
      font-size: clamp(40px, 10vw, 80px);
      font-weight: 700;
      text-align: center;
      color: #fff;
      -webkit-text-stroke: 3px var(--ink);
      paint-order: stroke fill;
      text-shadow: 0 6px 0 var(--ink);
    }
    h1 span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .sun {
      position: fixed; top: -40px; right: -40px; width: 160px; height: 160px; border-radius: 50%;
      background: var(--sun); box-shadow: 0 0 0 18px rgba(255, 214, 10, 0.35); z-index: 0;
    }
    .cloud {
      position: fixed; width: 120px; height: 40px; background: #fff; border-radius: 40px; z-index: 0;
      animation: drift linear infinite;
    }
    .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
    .cloud::before { width: 56px; height: 56px; left: 16px; top: -28px; }
    .cloud::after { width: 44px; height: 44px; left: 58px; top: -18px; }
    @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(110vw); } }

    .games {
      display: flex; flex-wrap: wrap; gap: 24px; justify-content: center;
      padding: 24px 16px 40px; max-width: 900px; overflow-y: auto;
    }
    .tile {
      width: 220px; height: 220px; border-radius: 36px;
      border: 6px solid var(--ink); box-shadow: 0 10px 0 var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-decoration: none; color: var(--ink);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .tile:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--ink); }
    .tile .pic { font-size: 110px; line-height: 1; animation: chug 1.2s ease-in-out infinite; }
    .tile .name { font-size: 30px; font-weight: 700; margin-top: 8px; text-align: center; line-height: 1.05; padding: 0 8px; }
    @keyframes chug { 0%, 100% { transform: translateX(-6px) rotate(-3deg); } 50% { transform: translateX(6px) rotate(3deg); } }
    .trains { background: linear-gradient(#ffe8a3, #ffc65c); }
    .memory { background: linear-gradient(#ffd1ec, #ff8fc8); }
    .balloons { background: linear-gradient(#d4f1ff, #8fd6ff); }
    .balloons .pic { animation: floaty 2s ease-in-out infinite; }
    @keyframes floaty { 0%, 100% { transform: translateY(6px) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
    .colours { background: linear-gradient(#e3dcff, #b5a6ff); }
    .colours .pic { animation: floaty 2.6s ease-in-out infinite; }
    .memory .pic { animation: flipy 2.4s ease-in-out infinite; }
    @keyframes flipy { 0%, 60%, 100% { transform: rotateY(0); } 80% { transform: rotateY(180deg); } }

    @media (max-width: 480px) {
      .tile { width: 170px; height: 170px; border-radius: 28px; }
      .tile .pic { font-size: 84px; }
      .tile .name { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="sun"></div>
  <div class="cloud" style="top: 70px; animation-duration: 38s; animation-delay: -10s"></div>
  <div class="cloud" style="top: 170px; animation-duration: 52s; animation-delay: -35s; transform: scale(0.7)"></div>

  <h1><span style="animation-delay:0s">Kevin's</span> <span style="animation-delay:.3s">Games</span></h1>

  <div class="games">
    <a class="tile trains" href="games/trains/index.html">
      <div class="pic emoji">🚂</div>
      <div class="name">Train Yard</div>
    </a>
    <a class="tile memory" href="games/memory/index.html">
      <div class="pic emoji">🃏</div>
      <div class="name">Memory Match</div>
    </a>
    <a class="tile balloons" href="games/balloons/index.html">
      <div class="pic emoji">🎈</div>
      <div class="name">Balloon Pop</div>
    </a>
    <a class="tile colours" href="games/colours/index.html">
      <div class="pic emoji">🌈</div>
      <div class="name">Connect Colours</div>
    </a>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
